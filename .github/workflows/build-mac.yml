name: Build macOS Binaries

on:
  push:
    tags:
      - 'v*' # Triggers the build whenever you push a version tag like v2.0.1
  workflow_dispatch: # Allows you to manually trigger the build from the GitHub Actions tab

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      # --- UPDATE THE BUILD COMMAND BELOW IF NEEDED ---
      # This step assumes your package.json has a script to compile for Mac, 
      # or you can replace it with your exact compilation command (e.g., npx pkg . --targets node20-macos-x64,node20-macos-arm64)
      - name: Compile macOS Binaries
        run: |
          npm run build:mac || npx pkg . --targets node20-macos-x64,node20-macos-arm64 --out-path dist/

      - name: Compress Binaries into ZIP
        run: |
          cd dist
          zip -r ../postmaster-mcp-mac-v2.zip ./*
          cd ..

      - name: Upload to Existing Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: postmaster-mcp-mac-v2.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}